<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comet Playbook — Study &amp; Quiz</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --court-black:#15181c;
    --panel:#1d2127;
    --panel-2:#242933;
    --line:#3a4150;
    --chalk:#f4f2ec;
    --steel:#8892a0;
    --gold:#ffc93c;
    --gold-dim:#7a6224;
    --good:#5fd08a;
    --bad:#ff6b6b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1100px 600px at 15% -10%, #232833 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 10%, #202430 0%, transparent 55%),
      var(--court-black);
    color:var(--chalk);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;padding:28px 18px 60px;}

  /* Header */
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:12px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .comet-mark{
    width:42px;height:42px;border-radius:8px;
    background:linear-gradient(135deg,#4b5262,#2a2e37);
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-family:'Archivo Black',sans-serif;color:var(--gold);font-size:20px;
    flex:none;
  }
  .brand h1{
    font-family:'Oswald',sans-serif;text-transform:uppercase;
    letter-spacing:0.06em;font-size:20px;margin:0;line-height:1.05;
  }
  .brand p{margin:2px 0 0;color:var(--steel);font-size:11.5px;letter-spacing:0.08em;text-transform:uppercase;}
  .scoreboard{
    display:flex;gap:10px;font-family:'Oswald',sans-serif;
  }
  .sb-cell{
    background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:6px 12px;text-align:center;min-width:56px;
  }
  .sb-cell .n{font-size:20px;font-weight:600;color:var(--gold);display:block;line-height:1.1;}
  .sb-cell .l{font-size:9px;color:var(--steel);letter-spacing:0.08em;text-transform:uppercase;}

  nav.tabs{display:flex;gap:8px;margin-bottom:22px;}
  .tab-btn{
    flex:1;padding:11px 10px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel);color:var(--steel);font-family:'Oswald',sans-serif;
    text-transform:uppercase;letter-spacing:0.05em;font-size:13px;font-weight:500;
    cursor:pointer;transition:all .15s ease;
  }
  .tab-btn.active{background:var(--gold);color:#20180a;border-color:var(--gold);}

  section{display:none;}
  section.active{display:block;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  /* Study mode */
  .chapter-row{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:2px 20px 12px 2px;margin-bottom:16px;-webkit-overflow-scrolling:touch;}
  .chapter-row::-webkit-scrollbar{height:5px;}
  .chapter-row::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
  .chip{
    flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);
    background:var(--panel);color:var(--steel);font-size:12.5px;font-weight:600;
    cursor:pointer;white-space:nowrap;
  }
  .chip.active{background:var(--panel-2);color:var(--gold);border-color:var(--gold-dim);}

  .card-stage{position:relative;height:340px;margin-bottom:16px;perspective:1400px;}
  .card{
    position:absolute;inset:0;border-radius:16px;cursor:pointer;
    transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.8,.2,1);
  }
  .card.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;
    padding:26px;display:flex;flex-direction:column;justify-content:center;
    border:1px solid var(--line);
  }
  .face.front{
    background:linear-gradient(160deg,var(--panel),var(--panel-2));
  }
  .face.back{
    background:linear-gradient(160deg,#2b2314,#1d2127 55%);
    transform:rotateY(180deg);
    border-color:var(--gold-dim);
  }
  .eyebrow{font-family:'Oswald',sans-serif;color:var(--gold);text-transform:uppercase;
    font-size:11.5px;letter-spacing:0.12em;margin-bottom:14px;}
  .face.back .eyebrow{color:var(--steel);}
  .face h2{font-family:'Archivo Black',sans-serif;font-size:26px;line-height:1.15;margin:0 0 8px;}
  .face p{font-size:15px;line-height:1.55;color:#d7d6d0;margin:0;}
  .tap-hint{position:absolute;bottom:16px;right:20px;font-size:11px;color:var(--steel);letter-spacing:.05em;text-transform:uppercase;}

  .card-controls{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .nav-btn{
    flex:none;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);
    background:var(--panel);color:var(--chalk);font-size:18px;cursor:pointer;
  }
  .progress-track{flex:1;height:6px;background:var(--panel);border-radius:4px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--gold);width:0%;transition:width .3s ease;}
  .count-label{font-size:12px;color:var(--steel);font-family:'Oswald',sans-serif;min-width:52px;text-align:center;}

  /* Quiz mode */
  .quiz-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .streak{
    font-family:'Oswald',sans-serif;font-size:12.5px;color:var(--steel);
    display:flex;align-items:center;gap:6px;
  }
  .streak b{color:var(--gold);font-size:16px;}
  .qcard{
    background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px;
  }
  .qtag{font-family:'Oswald',sans-serif;color:var(--steel);text-transform:uppercase;font-size:11px;letter-spacing:.1em;margin-bottom:10px;}
  .qtext{font-size:17px;font-weight:600;line-height:1.4;margin-bottom:18px;}
  .opt{
    display:block;width:100%;text-align:left;padding:13px 14px;margin-bottom:10px;
    background:var(--panel-2);border:1px solid var(--line);border-radius:10px;
    color:var(--chalk);font-size:14.5px;cursor:pointer;transition:border-color .15s ease, background .15s ease;
  }
  .opt:hover{border-color:var(--steel);}
  .opt.correct{background:rgba(95,208,138,0.15);border-color:var(--good);}
  .opt.incorrect{background:rgba(255,107,107,0.15);border-color:var(--bad);}
  .opt:disabled{cursor:default;}
  .explain{
    margin-top:6px;font-size:13.5px;color:var(--steel);line-height:1.5;
    border-top:1px dashed var(--line);padding-top:14px;
  }
  .next-wrap{display:flex;justify-content:flex-end;}
  .primary-btn{
    font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.06em;
    background:var(--gold);color:#20180a;border:none;border-radius:10px;
    padding:12px 22px;font-size:13.5px;font-weight:600;cursor:pointer;
  }
  .primary-btn:disabled{opacity:.35;cursor:default;}
  .ghost-btn{
    font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.06em;
    background:transparent;color:var(--steel);border:1px solid var(--line);border-radius:10px;
    padding:12px 22px;font-size:13.5px;cursor:pointer;
  }

  .result-panel{text-align:center;padding:34px 20px;}
  .result-panel .big{font-family:'Archivo Black',sans-serif;font-size:52px;color:var(--gold);margin-bottom:6px;}
  .result-panel .sub{color:var(--steel);font-size:14px;margin-bottom:22px;}

  footer{margin-top:28px;text-align:center;color:var(--line);font-size:11px;letter-spacing:.05em;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="comet-mark">W</div>
      <div>
        <h1>Comet Playbook</h1>
        <p>West Carter Volleyball · Next Ball</p>
      </div>
    </div>
    <div class="scoreboard">
      <div class="sb-cell"><span class="n" id="sb-score">0</span><span class="l">Score</span></div>
      <div class="sb-cell"><span class="n" id="sb-best">0</span><span class="l">Streak</span></div>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="study">Study</button>
    <button class="tab-btn" data-tab="quiz">Quiz</button>
  </nav>

  <!-- STUDY -->
  <section id="study" class="active">
    <div class="chapter-row" id="chapterRow"></div>

    <div class="card-stage">
      <div class="card" id="card">
        <div class="face front">
          <div class="eyebrow" id="frontTag">Chapter</div>
          <h2 id="frontTitle">Title</h2>
          <p id="frontHint">Tap the card to reveal.</p>
          <div class="tap-hint">Tap to flip →</div>
        </div>
        <div class="face back">
          <div class="eyebrow">What it means</div>
          <p id="backText">Detail.</p>
          <div class="tap-hint">← Tap to flip back</div>
        </div>
      </div>
    </div>

    <div class="card-controls">
      <button class="nav-btn" id="prevCard">‹</button>
      <div class="progress-track"><div class="progress-fill" id="cardProgress"></div></div>
      <span class="count-label" id="cardCount">1 / 1</span>
      <button class="nav-btn" id="nextCard">›</button>
    </div>
  </section>

  <!-- QUIZ -->
  <section id="quiz">
    <div class="quiz-head">
      <div class="qtag" id="quizProgressLabel" style="margin:0;">Question 1 of 20</div>
      <div class="streak">Streak <b id="liveStreak">0</b></div>
    </div>
    <div id="quizBody"></div>
  </section>

  <footer>West Carter Comet Volleyball — Relentless · Confident · Selfless</footer>
</div>

<script>
/* ---------- Content data, drawn from the program handbook ---------- */
const chapters = [
  {
    tag: "Mission",
    cards: [
      { t: "Our Mission", h: "What does West Carter Volleyball exist to build?", b: "To use volleyball as a platform to develop confident, disciplined, and resilient young athletes at all levels — rooted in competitive excellence, accountability, and pride, on and off the court." },
      { t: "Whole-Athlete Coaching", h: "What does coaching focus on beyond X's and O's?", b: "Developing the whole athlete: academically, mentally, physically, and socially — promoting personal growth, academic success through graduation, and positive contributions to school and community." },
    ]
  },
  {
    tag: "Next Ball",
    cards: [
      { t: "\u201cNext Ball\u201d", h: "What is the program slogan?", b: "\u201cNext Ball.\u201d Every rally is a new opportunity — missed serve, bad pass, lost point, or big win, the response is always the same: next ball." },
      { t: "In Practice", h: "What does Next Ball look like at practice?", b: "Missing a serve and immediately refocusing on the next rep; hustling to shag balls and reset drills without being asked; accepting corrections with a positive attitude; encouraging teammates after mistakes." },
      { t: "In Games", h: "What does Next Ball look like in games?", b: "Letting go of the last point — win or lose — and locking in on the next rally; staying confident after an error; positive body language on the court and bench; supporting teammates with energy, communication, and composure." },
      { t: "In School & Life", h: "What does Next Ball look like off the court?", b: "Bouncing back from a tough grade or day; taking responsibility for mistakes and learning from them; showing resilience, effort, and respect; understanding growth comes from how you respond, not what went wrong." },
    ]
  },
  {
    tag: "Parents",
    cards: [
      { t: "Parents Support By", h: "How do parents support the program?", b: "Encouraging their daughter to communicate directly with coaches, promoting accountability and ownership, respecting coaching decisions, supporting officials and opponents, and ensuring punctuality and preparedness." },
      { t: "Off-Limits Topics", h: "What should parents NOT discuss with coaches?", b: "Playing time, positions or roles, team strategy, and other athletes. Appropriate topics are health/well-being concerns and academic or behavioral issues." },
      { t: "If a Concern Arises", h: "What's the chain of communication?", b: "1) Athlete speaks directly with the coach. 2) Schedule a meeting for appropriate concerns. 3) Never approach coaches before or after matches/games. 4) If unresolved, contact the Athletic Director." },
    ]
  },
  {
    tag: "Attendance",
    cards: [
      { t: "The Six-Miss Meeting", h: "What happens once a player reaches six missed practices?", b: "The coaching staff may meet with the player and parent/guardian to discuss the attendance concern, expectations, and the player's role moving forward. This is not an automatic punishment." },
      { t: "Excused ≠ Exempt", h: "Do excused absences still count?", b: "Yes. Excused absences will not result in disciplinary consequences, but all absences still count toward the attendance total — the competitive effect of missed practice is the same regardless of reason." },
      { t: "No Guarantees", h: "Does a legitimate reason guarantee playing time?", b: "No. Supporting a player through difficult circumstances does not require the staff to guarantee a starting position, travel spot, rotation spot, or equal playing time." },
      { t: "The 90% Goal", h: "What's the program's attendance goal?", b: "At least 90% attendance throughout the season. Below that, the coaching staff may meet with the player and parent to discuss commitment, role, and expectations." },
    ]
  },
  {
    tag: "Standards",
    cards: [
      { t: "Academics First", h: "Where does school rank vs. volleyball?", b: "School volleyball will never outweigh classroom responsibilities. Players are expected to be on time to class, attend regularly, and stay on top of academic progress." },
      { t: "Workouts", h: "What's expected at strength & conditioning?", b: "Punctual and prepared for every session. Effort matters, reps are not skipped, and every workout should be evaluated." },
      { t: "Social Media", h: "What's the rule on texts, posts, and DMs?", b: "Assume nothing is truly private. Don't talk negatively about teammates, coaches, officials, or the team online or in group texts. If you wouldn't want it shared, screenshotted, or read aloud — don't send it." },
      { t: "Discipline", h: "What can happen if standards aren't met?", b: "Additional conditioning, temporary reduction of playing time, or removal from a practice or match — decided by the coaching staff, coordinated with school administration when necessary." },
    ]
  },
  {
    tag: "Culture",
    cards: [
      { t: "Culture Defined", h: "How is culture defined in the program?", b: "By how we act, communicate, and respond — especially when things are hard. Successful teams act with effort, focus, and positivity first, rather than waiting to \u201cfeel good\u201d to play well." },
      { t: "Who Creates It", h: "Who is responsible for the culture?", b: "The players create the culture, and then the culture shapes the players. \u201cYou are what you allow\u201d — behaviors that hurt team chemistry, effort, or accountability will not be tolerated." },
      { t: "Be a Comet", h: "What does it mean to be a Comet?", b: "We keep our body language strong. We stay loud, positive, and connected. We respond, we don't react. We hustle after mistakes. We trust our teammates. We compete every rally." },
    ]
  },
  {
    tag: "Core Values",
    cards: [
      { t: "Relentless · Confident · Selfless", h: "What are the three core values?", b: "Relentless, Confident, Selfless — the foundation for Mental Toughness, Physical Toughness, being Connected, and playing Selflessly." },
      { t: "Mental Toughness", h: "Define Mental Toughness.", b: "The ability to stay composed, focused, and confident regardless of score, role, or circumstance — including doing the right thing when no one is watching." },
      { t: "Connected", h: "Define Connected.", b: "Belief in team chemistry and trust. Volleyball demands connection on serve receive, defense, transition, and sideline energy — a connected team communicates and competes together." },
      { t: "Selfless", h: "Define Selfless.", b: "Doing what the team needs in the moment: covering a hitter, taking the tough serve, running the play, or celebrating a teammate's success." },
    ]
  },
  {
    tag: "Glossary",
    cards: [
      { t: "Sideout", h: "What is the Sideout Offensive System?", b: "Successfully receiving serve and scoring a point." },
      { t: "No Free Ball Mindset", h: "How should a free ball be treated?", b: "First-ball sideout is a priority. Any free ball is an opportunity to attack — free balls should never be treated casually." },
      { t: "Big Energy Play", h: "What counts as a Big Energy Play?", b: "Any play that shifts momentum: a hustle save, block touch, aggressive serve, loud communication, or bench energy." },
      { t: "Multiple Efforts", h: "What does Multiple Efforts mean?", b: "Never stopping after the first move — transitioning from defense to offense, covering hitters, chasing down tips, and staying engaged through the entire rally." },
    ]
  },
];

const quizQuestions = [
  { tag:"Mission", q:"What is the West Carter Volleyball program slogan?", opts:["Relentless Every Day","Next Ball","No Free Balls","Comet Strong"], a:1, ex:"\u201cNext Ball\u201d is the program slogan — every rally is treated as a fresh opportunity." },
  { tag:"Attendance", q:"After how many missed practices might the coaching staff meet with a player and parent?", opts:["Three","Six","Ten","Fifteen"], a:1, ex:"Six missed practices triggers a possible meeting to discuss the attendance concern and the player's role." },
  { tag:"Attendance", q:"Do excused absences count toward a player's attendance total?", opts:["No, they're fully exempt","Yes, all absences count toward the total","Only if unexcused","Only after game 5"], a:1, ex:"All absences count toward the total, since missed practice has the same competitive effect regardless of reason — though excused absences won't bring disciplinary consequences." },
  { tag:"Attendance", q:"What is the program's attendance goal for every player?", opts:["At least 75%","At least 85%","At least 90%","100%, no exceptions"], a:2, ex:"The goal is at least 90% attendance throughout the season." },
  { tag:"Attendance", q:"According to the attendance chart, what status applies to 7–9 missed practices?", opts:["Excellent Attendance","Good Attendance","Attendance Concern","Excessive Absences"], a:2, ex:"7–9 missed practices (about 85–89%) falls under 'Attendance Concern,' where role, rotation, or playing time may be affected until readiness is demonstrated." },
  { tag:"Parents", q:"Which topic is appropriate for parents to discuss with coaches?", opts:["Playing time","Team strategy","Health or well-being concerns","Other athletes"], a:2, ex:"Health/well-being and academic or behavioral issues are appropriate. Playing time, roles, strategy, and other athletes are not." },
  { tag:"Parents", q:"What is the first step if a concern arises?", opts:["Contact the Athletic Director","Approach the coach after the game","Encourage the athlete to speak directly with the coach","Post about it on social media"], a:2, ex:"The chain starts with the athlete speaking directly to the coach, then a scheduled meeting, and only then the Athletic Director if unresolved." },
  { tag:"Standards", q:"According to Program Standards, where does volleyball rank compared to the classroom?", opts:["Equal priority","Volleyball comes first during season","School will never outweigh classroom responsibilities... wait","Academics are a top priority and volleyball will never outweigh them"], a:3, ex:"Academics are a top priority — school volleyball will never outweigh classroom responsibilities." },
  { tag:"Standards", q:"What is the guidance on social media and group texts?", opts:["Private group chats are always safe","Assume nothing is truly private", "Only public posts matter","Delete messages after 24 hours to stay safe"], a:1, ex:"Student-athletes should assume messages, posts, and texts are never truly private — if you wouldn't want it shared or read aloud, don't send it." },
  { tag:"Culture", q:"Who creates the program's culture?", opts:["The Athletic Director","The players","The parents","The scoreboard"], a:1, ex:"The players create the culture, and then the culture shapes the players." },
  { tag:"Culture", q:"Which phrase captures 'what it means to be a Comet'?", opts:["We react, then we respond","We compete every rally","We wait to feel good before playing well","We avoid tough conversations"], a:1, ex:"'We compete every rally' is one of the six Comet statements, alongside strong body language, staying connected, and trusting teammates." },
  { tag:"Core Values", q:"What are the program's three core values?", opts:["Fast, Strong, Loud","Relentless, Confident, Selfless","Disciplined, Focused, Kind","Tough, Smart, Fair"], a:1, ex:"Relentless · Confident · Selfless are the three core values underlying Mental Toughness, Physical Toughness, Connected, and Selfless." },
  { tag:"Core Values", q:"Mental Toughness includes doing the right thing when...", opts:["The score is close","No one is watching","Coaches are grading drills","Cameras are rolling"], a:1, ex:"Mental Toughness includes doing the right thing when no one is watching." },
  { tag:"Glossary", q:"What is the 'No Free Ball Mindset'?", opts:["Free balls should be treated casually","Any free ball is an opportunity to attack","Free balls don't count toward the score","Only setters play free balls"], a:1, ex:"First-ball sideout is a priority — any free ball is an opportunity to attack, and should never be treated casually." },
  { tag:"Glossary", q:"'Multiple Efforts' refers to...", opts:["Doing extra conditioning after practice","Never stopping after the first move during a rally","Serving multiple times in a row","Substituting multiple players at once"], a:1, ex:"Multiple Efforts means never stopping after the first move — transitioning from defense to offense, covering hitters, and chasing down tips through the whole rally." },
  { tag:"Glossary", q:"A 'Big Energy Play' could be...", opts:["A missed serve","A hustle save or block touch","A timeout","A substitution"], a:1, ex:"Big Energy Plays are momentum-shifters: hustle saves, block touches, aggressive serves, loud communication, or bench energy." },
];

/* ---------- State ---------- */
let activeChapter = 0;
let cardIndex = 0;
let flipped = false;
let quizOrder = [...quizQuestions.keys()];
let quizIndex = 0;
let score = 0;
let streak = 0;
let bestStreak = 0;
let answered = false;

/* ---------- Elements ---------- */
const chapterRow = document.getElementById('chapterRow');
const cardEl = document.getElementById('card');
const frontTag = document.getElementById('frontTag');
const frontTitle = document.getElementById('frontTitle');
const frontHint = document.getElementById('frontHint');
const backText = document.getElementById('backText');
const cardProgress = document.getElementById('cardProgress');
const cardCount = document.getElementById('cardCount');
const sbScore = document.getElementById('sb-score');
const sbBest = document.getElementById('sb-best');
const liveStreak = document.getElementById('liveStreak');
const quizBody = document.getElementById('quizBody');
const quizProgressLabel = document.getElementById('quizProgressLabel');

/* ---------- Tabs ---------- */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
    document.getElementById(btn.dataset.tab).classList.add('active');
  });
});

/* ---------- Study mode ---------- */
function renderChapterChips(){
  chapterRow.innerHTML = '';
  chapters.forEach((ch, i) => {
    const chip = document.createElement('button');
    chip.className = 'chip' + (i === activeChapter ? ' active' : '');
    chip.textContent = ch.tag;
    chip.addEventListener('click', () => { activeChapter = i; cardIndex = 0; flipped = false; renderChapterChips(); renderCard(); });
    chapterRow.appendChild(chip);
  });
}

function renderCard(){
  const ch = chapters[activeChapter];
  const cd = ch.cards[cardIndex];
  frontTag.textContent = ch.tag;
  frontTitle.textContent = cd.t;
  frontHint.textContent = cd.h;
  backText.textContent = cd.b;
  cardEl.classList.remove('flipped');
  flipped = false;
  cardCount.textContent = `${cardIndex + 1} / ${ch.cards.length}`;
  cardProgress.style.width = `${((cardIndex + 1) / ch.cards.length) * 100}%`;
}

cardEl.addEventListener('click', () => {
  flipped = !flipped;
  cardEl.classList.toggle('flipped', flipped);
});

document.getElementById('prevCard').addEventListener('click', () => {
  const ch = chapters[activeChapter];
  cardIndex = (cardIndex - 1 + ch.cards.length) % ch.cards.length;
  renderCard();
});
document.getElementById('nextCard').addEventListener('click', () => {
  const ch = chapters[activeChapter];
  cardIndex = (cardIndex + 1) % ch.cards.length;
  renderCard();
});

/* ---------- Quiz mode ---------- */
function shuffle(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function startQuiz(){
  quizOrder = shuffle([...quizQuestions.keys()]);
  quizIndex = 0;
  score = 0;
  streak = 0;
  answered = false;
  updateScoreboard();
  renderQuestion();
}

function updateScoreboard(){
  sbScore.textContent = score;
  sbBest.textContent = bestStreak;
  liveStreak.textContent = streak;
}

function renderQuestion(){
  if(quizIndex >= quizOrder.length){
    renderResult();
    return;
  }
  answered = false;
  const q = quizQuestions[quizOrder[quizIndex]];
  quizProgressLabel.textContent = `Question ${quizIndex + 1} of ${quizOrder.length}`;
  quizBody.innerHTML = '';

  const card = document.createElement('div');
  card.className = 'qcard';

  const tag = document.createElement('div');
  tag.className = 'qtag';
  tag.textContent = q.tag;
  card.appendChild(tag);

  const qt = document.createElement('div');
  qt.className = 'qtext';
  qt.textContent = q.q;
  card.appendChild(qt);

  q.opts.forEach((opt, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = opt;
    b.addEventListener('click', () => selectAnswer(i, q, card));
    card.appendChild(b);
  });

  quizBody.appendChild(card);

  const nextWrap = document.createElement('div');
  nextWrap.className = 'next-wrap';
  const nextBtn = document.createElement('button');
  nextBtn.className = 'primary-btn';
  nextBtn.textContent = (quizIndex === quizOrder.length - 1) ? 'See Results' : 'Next Ball →';
  nextBtn.disabled = true;
  nextBtn.id = 'nextQBtn';
  nextBtn.addEventListener('click', () => { quizIndex++; renderQuestion(); });
  nextWrap.appendChild(nextBtn);
  quizBody.appendChild(nextWrap);
}

function selectAnswer(i, q, card){
  if(answered) return;
  answered = true;
  const opts = card.querySelectorAll('.opt');
  opts.forEach((el, idx) => {
    el.disabled = true;
    if(idx === q.a) el.classList.add('correct');
    else if(idx === i) el.classList.add('incorrect');
  });

  if(i === q.a){
    score++;
    streak++;
    if(streak > bestStreak) bestStreak = streak;
  } else {
    streak = 0;
  }
  updateScoreboard();

  const explain = document.createElement('div');
  explain.className = 'explain';
  explain.textContent = q.ex;
  card.appendChild(explain);

  document.getElementById('nextQBtn').disabled = false;
}

function renderResult(){
  quizProgressLabel.textContent = 'Match Complete';
  quizBody.innerHTML = '';
  const panel = document.createElement('div');
  panel.className = 'qcard result-panel';
  const pct = Math.round((score / quizOrder.length) * 100);
  panel.innerHTML = `
    <div class="big">${score}/${quizOrder.length}</div>
    <div class="sub">${pct}% · Best streak this run: ${bestStreak}</div>
  `;
  const again = document.createElement('button');
  again.className = 'primary-btn';
  again.textContent = 'Run It Back';
  again.addEventListener('click', startQuiz);
  panel.appendChild(again);
  quizBody.appendChild(panel);
}

/* ---------- Init ---------- */
renderChapterChips();
renderCard();
startQuiz();
</script>
</body>
</html>
